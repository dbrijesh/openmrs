# =============================================================================
# OpenMRS Spring Boot 3.4.5 Configuration
# =============================================================================

# Server configuration
server.port=8080
server.servlet.context-path=/openmrs

# Tomcat configuration for Jakarta Servlet 6.0
server.tomcat.uri-encoding=UTF-8
server.tomcat.max-connections=200
# Enable multipart for file uploads (module installation)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Spring Boot Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.server.port=8081

# Application info
spring.application.name=openmrs-core
info.app.name=OpenMRS Core
info.app.version=@project.version@
info.app.java=@java.version@
info.app.spring-boot=@project.parent.version@

# Allow OpenMRS XML beans to override Spring Boot auto-configured beans (e.g. transactionInterceptor)
spring.main.allow-bean-definition-overriding=true
# OpenMRS has circular references between event listeners and services (openmrsEventListeners <-> adminService)
spring.main.allow-circular-references=true

# Disable Spring Boot's auto-configured DataSource
# OpenMRS manages its own DataSource via Hibernate C3P0 connection pool
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# Logging - OpenMRS uses its own log4j2.xml
# Disable Spring Boot's default logging autoconfiguration
logging.config=classpath:log4j2.xml

# Cache - OpenMRS uses JCache/EHCache 3.x configured via CacheConfig.java
spring.cache.type=jcache

# MVC - static resources
spring.mvc.static-path-pattern=/scripts/**
spring.web.resources.static-locations=classpath:/static/

# Actuator CORS — allows the test.html page (port 8080) to call actuator (port 8081)
management.endpoints.web.cors.allowed-origins=http://localhost:8080
management.endpoints.web.cors.allowed-methods=GET,POST
management.endpoints.web.cors.allowed-headers=*

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
