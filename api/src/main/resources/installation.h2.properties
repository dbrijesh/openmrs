# H2 database auto-install config for openmrs-core Java 25 migration demo
install_method=auto

# H2 file-based database in the application data directory
connection.url=jdbc:h2:/tmp/openmrs-data/database/openmrs;AUTO_RECONNECT=TRUE;DB_CLOSE_DELAY=-1;MODE=LEGACY;NON_KEYWORDS=VALUE
connection.driver_class=org.h2.Driver
connection.username=sa
connection.password=sa

database_name=openmrs
has_current_openmrs_database=false
create_database_user=false
create_tables=true
add_demo_data=false
module_web_admin=true
auto_update_database=true

admin_user_password=Admin123

# Hibernate dialect for H2
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.cache.use_second_level_cache=false
hibernate.search.enabled=false
