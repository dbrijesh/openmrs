# OpenMRS runtime properties - H2 file database
connection.url=jdbc:h2:file:E:/JavaUpgradeDemo/openmrs-h2/openmrs;AUTO_RECONNECT=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE,USER,PASSWORD
connection.driver_class=org.h2.Driver
connection.username=sa
connection.password=sa

hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.cache.use_second_level_cache=false
hibernate.search.enabled=false

# install_method=auto: InitializationFilter runs schema creation on first HTTP request
# install_method=auto
has_current_openmrs_database=false
create_database_user=false
create_tables=true
add_demo_data=false
module_web_admin=true
# false = let InitializationFilter do the full setup (schema + core data + updates)
# true  = would skip InitializationFilter and call checkForDatabaseUpdates() directly
auto_update_database=false
admin_user_password=Admin123
