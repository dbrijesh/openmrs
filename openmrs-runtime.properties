# OpenMRS runtime properties - H2 in-memory database for development/testing
# Place this file next to the WAR or in ~/.OpenMRS/

connection.url=jdbc:h2:file:E:/JavaUpgradeDemo/openmrs-h2/openmrs;AUTO_RECONNECT=TRUE;DB_CLOSE_DELAY=-1;MODE=LEGACY;NON_KEYWORDS=VALUE
connection.driver_class=org.h2.Driver
connection.username=sa
connection.password=sa

# H2 dialect
hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable second level cache for H2 testing
hibernate.cache.use_second_level_cache=false
hibernate.search.enabled=false

# Skip Liquibase for startup validation (Spring Boot / Tomcat boot test)
# Set to true when ready to run full schema creation (takes 30+ min on H2)
install_method=auto
has_current_openmrs_database=true
create_database_user=false
create_tables=false
add_demo_data=false
module_web_admin=true
auto_update_database=false
admin_user_password=Admin123
